name: Update daily candles

on:
  schedule:
    # 15:55 JST on weekdays (GitHub may start a few minutes late)
    - cron: "55 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candles
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.54"
      - run: python scripts/fetch_candles.py
        env:
          TZ: Asia/Tokyo
      - run: python scripts/build_signals.py
        continue-on-error: true
      - run: python scripts/fetch_market.py
        continue-on-error: true
      - run: python scripts/fetch_fundamentals.py
        continue-on-error: true
        timeout-minutes: 15
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: candles $(TZ=Asia/Tokyo date +%F)"
          git push
